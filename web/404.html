<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Substitution</title>
  <script>
    // Single Page App redirect for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    //
    // When GitHub Pages serves a 404, this script encodes the current
    // path + query into a query parameter and redirects to index.html,
    // which then restores the original URL via history.replaceState.
    var pathSegmentsToKeep = 1; // Keep '/substitution' prefix (repo name)
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
