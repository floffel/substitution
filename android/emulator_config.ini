# Android Emulator Configuration File
# This file configures the Android Virtual Device (AVD) for CI/CD testing
# Optimized for headless execution in Docker with minimal resource usage
#
# Used by: scripts/run-android-tests.sh
# Location: ~/.android/avd/android_test.avd/config.ini

# Device Hardware Profile
hw.device.name=pixel_5
hw.device.manufacturer=Google
hw.device.model=Pixel 5

# System Image Configuration
image.sysdir.1=system-images/android-33/google_apis/x86_64/

# Screen Configuration
hw.lcd.width=1080
hw.lcd.height=1920
hw.lcd.density=420
hw.lcd.depth=32

# Memory Configuration
hw.ramSize=2048
vm.heapSize=512
disk.dataPartition.size=6000

# Storage
hw.sdCard=yes
sdcard.size=512M

# Peripheral Support
hw.keyboard=yes
hw.dPad=yes
hw.mainKeys=no
hw.trackBall=no
hw.battery=yes
hw.gps=yes

# Camera Configuration
hw.qemu.camera=emulated
hw.camera.front=emulated
hw.camera.back=emulated

# Audio Configuration
hw.audio=no
hw.audioInput=no
hw.audioOutput=no

# Accelerometer & Gyroscope
hw.sensors.orientation=yes
hw.sensors.proximity=yes
hw.sensors.magnetic_field=yes
hw.sensors.acceleration=yes
hw.sensors.gyroscope=yes
hw.sensors.temperature=yes

# Graphics Configuration
hw.gpu.enabled=no
hw.gpu.mode=off
hw.glExtensions=
hw.initialOrientation=portrait

# QEMU Configuration
hw.qemu.gl=off

# Boot Configuration
ro.hardware.keystore=ranchu
kernel.newDeviceNaming=yes
boot.prop.disable_rescue=true

# Bootloader Configuration
ro.boot.bootloader=generic_arm64
ro.boot.baseband=unknown
ro.boot.serialno=android_test
ro.bootloader=generic_arm64
ro.bootimage.build.fingerprint=generic_arm64
ro.baseband=unknown

# Security
ro.secure=1
ro.debuggable=1

# ADB Configuration
ro.adb.secure=0
persist.sys.usb.config=adb

# Performance Tuning
vm.useriop=no
vm.checkjni=no
debug.atrace.tags.enableflags=0

# Locale Configuration
ro.com.google.clientidbase=android-google
ro.url.legal=http://www.google.com/intl/%s/mobile/android/basic/phone-legal.html
ro.url.legal.android_privacy=http://www.google.com/intl/%s/mobile/android/basic/privacy.html

# Timezone
persist.sys.timezone=UTC

# Custom Properties for Testing
# These can be read by tests via adb shell getprop
ro.test.emulator=true
ro.test.docker=true
ro.test.ci=true
