name: Integration Tests (Multi-Platform)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allow manual trigger

env:
  CACHE_VERSION: v1

jobs:
  # ============================================================================
  # DISCOVERY JOB - Calculate shards for dynamic matrix
  # ============================================================================
  plan-tests:
    runs-on: ubuntu-latest
    name: 'Plan Test Shards'
    outputs:
      shard_count: ${{ steps.set-shards.outputs.shard_count }}
      shard_matrix: ${{ steps.set-shards.outputs.shard_matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-shards
        run: |
          # Count integration test files
          TOTAL_TESTS=$(find integration_test -maxdepth 1 -name '*_test.dart' | wc -l)
          echo "Total integration tests: $TOTAL_TESTS"
          
          # Max 7 tests per runner
          MAX_PER_RUNNER=7
          SHARD_COUNT=$(( (TOTAL_TESTS + MAX_PER_RUNNER - 1) / MAX_PER_RUNNER ))
          
          if [ "$SHARD_COUNT" -eq 0 ]; then SHARD_COUNT=1; fi
          echo "Calculated shard count: $SHARD_COUNT"
          
          # Create a JSON array [0, 1, 2, ..., SHARD_COUNT-1]
          MATRIX_JSON=$(seq 0 $((SHARD_COUNT - 1)) | jq -R . | jq -s -c .)
          echo "shard_matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
          echo "shard_count=$SHARD_COUNT" >> $GITHUB_OUTPUT

  # ============================================================================
  # SETUP JOB - Check that code is ready for testing
  # ============================================================================
  setup:
    needs: plan-tests
    runs-on: ubuntu-latest
    name: 'Setup & Validation'
    steps:
      - uses: actions/checkout@v4

      - name: 'Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 'Install dependencies'
        run: flutter pub get

      - name: 'Validate Flutter setup'
        run: flutter doctor -v

      - name: 'Analyze code'
        run: flutter analyze --no-pub

  # ============================================================================
  # UNIT TESTS (no Docker needed, ~2 minutes)
  # ============================================================================
  unit-tests:
    runs-on: ubuntu-latest
    name: 'Unit & Widget Tests'
    needs: setup
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: 'Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 'Install dependencies'
        run: flutter pub get

      - name: 'Run unit tests'
        run: ./scripts/test.sh unit --no-docker

  # ============================================================================
  # WEB TESTS (Linux runner, ~15-20 minutes)
  # Runs two phases: unit/widget tests on Chrome, then integration_test/ on web device.
  # ============================================================================
  web-tests:
    runs-on: ubuntu-latest
    name: 'Web Tests'
    needs: [setup, plan-tests]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan-tests.outputs.shard_matrix) }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 'Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 'Install dependencies'
        run: flutter pub get

      - name: 'Enable web'
        run: flutter config --enable-web

      - name: 'Start Matrix test server'
        run: |
          docker compose up -d postgres matrix-synapse redis
          sleep 10
          docker compose run --rm matrix-init
          timeout 60 bash -c 'until curl -sf http://localhost:8008/_matrix/client/versions > /dev/null 2>&1; do sleep 2; done'

      - name: 'Run web tests'
        env:
          MATRIX_SERVER: http://localhost:8008
          MATRIX_TEST_USER: testuser1
          MATRIX_TEST_PASSWORD: testpass123
        run: ./scripts/test.sh web --no-docker --shard ${{ matrix.shard }} --total-shards ${{ needs.plan-tests.outputs.shard_count }}
        timeout-minutes: 25

      - name: 'Stop Matrix test server'
        if: always()
        run: docker compose down -v

  # ============================================================================
  # LINUX DESKTOP TESTS (Linux runner, ~20-30 minutes)
  # ============================================================================
  linux-tests:
    runs-on: ubuntu-latest
    name: 'Linux Desktop Tests'
    needs: [setup, plan-tests]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan-tests.outputs.shard_matrix) }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 'Install Linux desktop dependencies'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev libsqlite3-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libblkid-dev libdbus-1-dev libatk1.0-dev \
            xvfb

      - name: 'Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 'Install dependencies'
        run: |
          flutter precache --linux
          flutter pub get

      - name: 'Enable Linux desktop'
        run: flutter config --enable-linux-desktop

      - name: 'Start Matrix test server'
        run: |
          docker compose up -d postgres matrix-synapse redis
          sleep 10
          docker compose run --rm matrix-init
          timeout 60 bash -c 'until curl -sf http://localhost:8008/_matrix/client/versions > /dev/null 2>&1; do sleep 2; done'

      - name: 'Diagnose Linux device'
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 2
          flutter config --enable-linux-desktop
          echo "--- flutter devices ---"
          flutter devices
          echo "--- flutter doctor ---"
          flutter doctor -v
          pkill Xvfb || true

      - name: 'Run Linux integration tests'
        env:
          MATRIX_SERVER: http://localhost:8008
          MATRIX_TEST_USER: testuser1
          MATRIX_TEST_PASSWORD: testpass123
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" ./scripts/test.sh linux --no-docker --shard ${{ matrix.shard }} --total-shards ${{ needs.plan-tests.outputs.shard_count }}
        timeout-minutes: 25

      - name: 'Stop Matrix test server'
        if: always()
        run: docker compose down -v

  # ============================================================================
  # iOS TESTS (macOS runner, ~30-40 minutes)
  # ============================================================================
  ios-tests:
    runs-on: macos-latest
    name: 'iOS Tests (Simulator)'
    needs: [setup, plan-tests]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan-tests.outputs.shard_matrix) }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: 'Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 'Install dependencies'
        run: |
          flutter precache --ios
          flutter pub get

      - name: 'Run iOS integration tests (Batched)'
        env:
          # Note: Local Matrix server is not available on macOS runners (no Docker).
          # Tests depending on a local server may fail or should be skipped.
          MATRIX_SERVER: http://localhost:8008
          MATRIX_TEST_USER: testuser1
          MATRIX_TEST_PASSWORD: testpass123
        run: ./scripts/test.sh ios --no-docker --shard ${{ matrix.shard }} --total-shards ${{ needs.plan-tests.outputs.shard_count }}
        timeout-minutes: 60

  # ============================================================================
  # ANDROID TESTS (Linux runner, ~25-35 minutes)
  # ============================================================================
  android-tests:
    runs-on: ubuntu-latest
    name: 'Android Tests'
    needs: [setup, plan-tests]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan-tests.outputs.shard_matrix) }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: 'Setup Java'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 'Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 'Install dependencies'
        run: |
          flutter precache --android
          flutter pub get

      - name: 'Start Matrix test server'
        run: |
          docker compose up -d postgres matrix-synapse redis
          sleep 10
          docker compose run --rm matrix-init
          timeout 60 bash -c 'until curl -sf http://localhost:8008/_matrix/client/versions > /dev/null 2>&1; do sleep 2; done'

      - name: 'Run Android integration tests'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MATRIX_SERVER: http://localhost:8008
          MATRIX_TEST_USER: testuser1
          MATRIX_TEST_PASSWORD: testpass123
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: ./scripts/test.sh android --no-docker --shard ${{ matrix.shard }} --total-shards ${{ needs.plan-tests.outputs.shard_count }}

      - name: 'Stop Matrix test server'
        if: always()
        run: docker compose down -v

  # ============================================================================
  # FINAL STATUS CHECK
  # ============================================================================
  all-tests-passed:
    runs-on: ubuntu-latest
    name: 'All Tests Passed'
    needs: [unit-tests, web-tests, linux-tests, ios-tests, android-tests]
    if: always()
    steps:
      - name: 'Check all jobs passed'
        run: |
          # Note: result is 'success', 'failure', 'cancelled', or 'skipped'
          # For matrix jobs, needs.JOB_NAME.result is 'success' only if ALL shards pass.
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.web-tests.result }}" != "success" ] || \
             [ "${{ needs.linux-tests.result }}" != "success" ] || \
             [ "${{ needs.ios-tests.result }}" != "success" ] || \
             [ "${{ needs.android-tests.result }}" != "success" ]; then
            echo "One or more test jobs failed"
            echo "  unit-tests:    ${{ needs.unit-tests.result }}"
            echo "  web-tests:     ${{ needs.web-tests.result }}"
            echo "  linux-tests:   ${{ needs.linux-tests.result }}"
            echo "  ios-tests:     ${{ needs.ios-tests.result }}"
            echo "  android-tests: ${{ needs.android-tests.result }}"
            exit 1
          fi
          echo "All test jobs passed"
