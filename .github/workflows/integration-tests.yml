name: Integration Tests (Multi-Platform)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allow manual trigger

env:
  FLUTTER_VERSION: '3.19.0'
  CACHE_VERSION: v1

jobs:
  # ============================================================================
  # SETUP JOB - Check that code is ready for testing
  # ============================================================================
  setup:
    runs-on: ubuntu-latest
    name: 'Setup & Validation'
    steps:
      - uses: actions/checkout@v4

      - name: 'Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 'Install dependencies'
        run: flutter pub get

      - name: 'Validate Flutter setup'
        run: flutter doctor -v

      - name: 'Analyze code'
        run: flutter analyze --no-pub

  # ============================================================================
  # UNIT TESTS (no Docker needed, ~2 minutes)
  # ============================================================================
  unit-tests:
    runs-on: ubuntu-latest
    name: 'Unit & Widget Tests'
    needs: setup
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: 'Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 'Install dependencies'
        run: flutter pub get

      - name: 'Run unit tests'
        run: ./scripts/test.sh unit --no-docker

  # ============================================================================
  # WEB TESTS (Linux runner, ~12-15 minutes)
  # ============================================================================
  web-tests:
    runs-on: ubuntu-latest
    name: 'Web Tests'
    needs: setup
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 'Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 'Install dependencies'
        run: flutter pub get

      - name: 'Start Matrix test server'
        run: |
          docker-compose up -d postgres matrix-synapse redis
          sleep 10
          docker-compose run --rm matrix-init
          timeout 60 bash -c 'until curl -sf http://localhost:8008/_matrix/client/versions > /dev/null 2>&1; do sleep 2; done'

      - name: 'Run web integration tests'
        env:
          MATRIX_SERVER: http://localhost:8008
          MATRIX_TEST_USER: testuser1
          MATRIX_TEST_PASSWORD: testpass123
        run: ./scripts/test.sh web --no-docker
        timeout-minutes: 15

      - name: 'Stop Matrix test server'
        if: always()
        run: docker-compose down -v

  # ============================================================================
  # iOS TESTS (macOS runner, ~30-40 minutes)
  # ============================================================================
  ios-tests:
    runs-on: macos-latest
    name: 'iOS Tests (Simulator)'
    needs: setup
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: 'Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 'Install dependencies'
        run: flutter pub get

      - name: 'Start Matrix test server'
        run: |
          docker-compose up -d postgres matrix-synapse redis
          sleep 10
          docker-compose run --rm matrix-init
          timeout 60 bash -c 'until curl -sf http://localhost:8008/_matrix/client/versions > /dev/null 2>&1; do sleep 2; done'

      - name: 'Run iOS integration tests'
        env:
          MATRIX_SERVER: http://localhost:8008
          MATRIX_TEST_USER: testuser1
          MATRIX_TEST_PASSWORD: testpass123
        run: ./scripts/test.sh ios --no-docker
        timeout-minutes: 35

      - name: 'Stop Matrix test server'
        if: always()
        run: docker-compose down -v

  # ============================================================================
  # ANDROID TESTS (Linux runner, ~25-35 minutes)
  # ============================================================================
  android-tests:
    runs-on: ubuntu-latest
    name: 'Android Tests'
    needs: setup
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: 'Setup Java'
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: 'Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 'Install Android SDK'
        run: |
          sdkmanager --licenses <<< y || true
          sdkmanager "platforms;android-33" \
            "build-tools;33.0.0" \
            "system-images;android-31;google_apis;x86" \
            "emulator" \
            "platform-tools"

      - name: 'Install dependencies'
        run: flutter pub get

      - name: 'Start Matrix test server'
        run: |
          docker-compose up -d postgres matrix-synapse redis
          sleep 10
          docker-compose run --rm matrix-init
          timeout 60 bash -c 'until curl -sf http://localhost:8008/_matrix/client/versions > /dev/null 2>&1; do sleep 2; done'

      - name: 'Run Android integration tests'
        env:
          MATRIX_SERVER: http://localhost:8008
          MATRIX_TEST_USER: testuser1
          MATRIX_TEST_PASSWORD: testpass123
        run: ./scripts/test.sh android --no-docker
        timeout-minutes: 25

      - name: 'Stop Matrix test server'
        if: always()
        run: docker-compose down -v

  # ============================================================================
  # FINAL STATUS CHECK
  # ============================================================================
  all-tests-passed:
    runs-on: ubuntu-latest
    name: 'All Tests Passed'
    needs: [unit-tests, web-tests, ios-tests, android-tests]
    if: always()
    steps:
      - name: 'Check all jobs passed'
        run: |
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.web-tests.result }}" != "success" ] || \
             [ "${{ needs.ios-tests.result }}" != "success" ] || \
             [ "${{ needs.android-tests.result }}" != "success" ]; then
            echo "One or more test jobs failed"
            echo "  unit-tests: ${{ needs.unit-tests.result }}"
            echo "  web-tests: ${{ needs.web-tests.result }}"
            echo "  ios-tests: ${{ needs.ios-tests.result }}"
            echo "  android-tests: ${{ needs.android-tests.result }}"
            exit 1
          fi
          echo "All test jobs passed"
